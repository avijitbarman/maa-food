<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Delivery Portal</title><link rel="stylesheet" href="style.css"></head><body><header><b>🚚 Delivery Portal</b><nav><a href="admin.html">Admin Portal</a><button id="signOut" class="link-btn hidden" type="button">Sign out</button></nav></header><main><section id="loginGate" class="panel login-card"><h2>Delivery login</h2><p>Sign in with your delivery ID and password.</p><input id="email" type="email" autocomplete="username" placeholder="Delivery ID"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login" class="primary" type="button">Sign in</button><p id="loginMsg" class="message"></p></section><section id="accessDenied" class="panel login-card hidden"><h2>Delivery access only</h2><p>This account is not a delivery account.</p></section><div id="appContent" class="hidden"><section class="hero"><div><small>DELIVERY</small><h1>Customer<br><i>Directory.</i></h1><p>Call customers, open locations and mark food as delivered. Delivered customers move to the bottom.</p></div><div class="stat"><strong id="count">0</strong><span>Customers</span></div></section><div class="toolbar"><input id="search" placeholder="Search customer or location..."><button id="resetDelivered" class="reset-btn" type="button">Reset ticks</button></div><p id="status" class="message"></p><div id="locations"></div></div></main><script type="module" src="delivery.js"></script></body></html>
